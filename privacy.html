    .eyebrow{display:inline-flex;padding:8px 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:800}
    h1{margin:18px 0 10px;font-size:clamp(34px,5vw,58px);line-height:1.08;letter-spacing:-.05em}
    .lead{max-width:720px;color:var(--muted);font-size:17px;margin:0 0 8px}
    .updated{color:#8c837b;font-size:14px;margin:0}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-top:22px}
    .language-switcher{display:flex;flex-wrap:wrap;gap:8px}
    .language-switcher a{border:1px solid var(--line);border-radius:999px;color:#665d57;background:#fff;font-size:12px;font-weight:700;line-height:1;padding:10px 13px;text-decoration:none}
    .language-switcher a[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
    .quick-link{display:inline-flex;align-items:center;justify-content:center;padding:13px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);text-decoration:none;font-weight:800}
    main{padding:18px 0 72px}
    .section-grid{display:grid;gap:16px}
    .card{padding:26px;border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 12px 26px rgba(28,19,15,.04)}
    .card h2{margin:0 0 12px;font-size:22px;letter-spacing:-.03em}
    .card p{margin:0;color:#2a241f;font-size:15px}
    .stack p + p{margin-top:12px}
    .app-policy{display:grid;grid-template-columns:1fr;gap:14px}
    .app-block{padding:18px;border-radius:20px;background:#faf6f1;border:1px solid #efe6dc}
    .app-block h3{margin:0 0 8px;font-size:17px;letter-spacing:-.02em}.app-block p{margin:0;color:#4e473f;font-size:14px}.app-block p + p{margin-top:10px}

    footer{padding:10px 0 48px;color:#8a817a;font-size:13px;text-align:center}
    @media (max-width:720px){.wrap{width:min(100% - 32px,560px)}.hero-shell{padding:24px}.toolbar{align-items:flex-start;flex-direction:column}}
