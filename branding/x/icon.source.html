<!doctype html>
<html><head><meta charset="utf-8">

</head>
<body>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="45%" stop-color="#FFE0EC"/>
      <stop offset="100%" stop-color="#BFE0FF"/>
    </radialGradient>

    <linearGradient id="gPink" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF8FC0"/>
      <stop offset="1" stop-color="#FFD3E8"/>
    </linearGradient>
    <linearGradient id="gPeach" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFAE7A"/>
      <stop offset="1" stop-color="#FFDDBB"/>
    </linearGradient>
    <linearGradient id="gLavender" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#B79CFF"/>
      <stop offset="1" stop-color="#EBE0FF"/>
    </linearGradient>
    <linearGradient id="gSky1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5FBBFF"/>
      <stop offset="1" stop-color="#BFE6FF"/>
    </linearGradient>
    <linearGradient id="gSky2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3FA0F5"/>
      <stop offset="1" stop-color="#9CD4FF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="400" fill="url(#bg)"/>

  <g transform="translate(200,235) scale(2.35)">
    <g id="wingmark">
      <g stroke="#4A3B52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <path transform="rotate(-78) scale(0.6)"  fill="url(#gPink)"     d="M0,0 Q-16,-28 -9,-52 Q-4,-63 0,-69 Q4,-63 9,-52 Q16,-28 0,0 Z"/>
        <path transform="rotate(-42) scale(0.84)" fill="url(#gPeach)"    d="M0,0 Q-16,-28 -9,-52 Q-4,-63 0,-69 Q4,-63 9,-52 Q16,-28 0,0 Z"/>
        <path transform="rotate(-8) scale(1.05)"  fill="url(#gLavender)" d="M0,0 Q-16,-28 -9,-52 Q-4,-63 0,-69 Q4,-63 9,-52 Q16,-28 0,0 Z"/>
        <path transform="rotate(26) scale(0.9)"   fill="url(#gSky1)"     d="M0,0 Q-16,-28 -9,-52 Q-4,-63 0,-69 Q4,-63 9,-52 Q16,-28 0,0 Z"/>
        <path transform="rotate(56) scale(0.68)"  fill="url(#gSky2)"     d="M0,0 Q-16,-28 -9,-52 Q-4,-63 0,-69 Q4,-63 9,-52 Q16,-28 0,0 Z"/>
      </g>
      <circle r="13" fill="#FFF8F0" stroke="#4A3B52" stroke-width="5"/>
      <g fill="#FFD966" stroke="#4A3B52" stroke-width="2.5" stroke-linejoin="round">
        <path transform="translate(14,-80) scale(0.48) rotate(12)" d="M0,-14 L4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4 Z"/>
      </g>
      <circle cx="38" cy="-64" r="3.4" fill="#FFD966" stroke="#4A3B52" stroke-width="2"/>
    </g>
  </g>
