<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta id="meta-description" name="description" content="">
  <meta name="theme-color" content="#F8EFE7">
  <meta id="og-title" property="og:title" content="">
  <meta id="og-description" property="og:description" content="">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <title>Sofubi Journal - Tsubasa Studio</title>
  <style>
    :root {
      --ink:#26211e; --muted:#746c66; --paper:#fffaf6; --line:#eaded5; --card:#ffffff;
      --accent:#e76943; --accent-soft:#fff1eb; --accent-dark:#bd4e2d; --shadow:0 24px 54px rgba(189,78,45,.16);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Hiragino Sans","PingFang TC","Noto Sans TC","Yu Gothic",Arial,sans-serif;line-height:1.65}
    a{color:inherit}
    img{max-width:100%;display:block}
    .wrap{width:min(1120px,calc(100% - 40px));margin:0 auto}
    header{padding:22px 0}
    .nav{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:14px}
    .brand{font-weight:800;letter-spacing:.04em;text-decoration:none;white-space:nowrap}
    .nav-right{display:flex;align-items:center;justify-content:flex-end;gap:18px;flex-wrap:wrap}
    .nav-links{display:flex;gap:18px;flex-wrap:wrap}
    .nav-links a{color:var(--muted);text-decoration:none}
    .language-switcher{display:flex;flex-wrap:wrap;gap:7px}
    .language-switcher a{border:1px solid var(--line);border-radius:999px;color:#665d57;background:#fff;font-size:12px;font-weight:700;line-height:1;padding:9px 12px;text-decoration:none}
    .language-switcher a[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
    .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center;min-height:650px;padding:48px 0 72px}
    .eyebrow{display:inline-flex;padding:7px 13px;border-radius:999px;color:var(--accent-dark);background:var(--accent-soft);font-size:13px;font-weight:800}
    h1{margin:20px 0 18px;font-size:clamp(42px,6vw,72px);line-height:1.12;letter-spacing:-.055em}
    .lead{max-width:590px;color:var(--muted);font-size:18px}
    .badges{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}
    .badges span{border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:#665d57;background:#fff;font-size:13px}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-width:180px;padding:15px 20px;border-radius:16px;font-weight:800;text-decoration:none}
    .button.primary{background:var(--ink);color:#fff}
    .button.secondary{background:#fff;border:1px solid var(--line)}
    .availability{margin-top:16px;color:var(--muted);font-size:14px}
    .hero-stage{min-height:560px;display:grid;place-items:center;padding:28px;border-radius:42px;background:radial-gradient(circle at 80% 12%,#fbe2d8 0,transparent 31%),linear-gradient(145deg,#fff1eb,#ffffff 57%,#e4f2ef);overflow:hidden;position:relative}
    .hero-stage:before,.hero-stage:after{content:"";position:absolute;border:2px solid rgba(231,105,67,.16);border-radius:32px;transform:rotate(-12deg)}
    .hero-stage:before{width:300px;height:170px;top:46px;right:-10px}
    .hero-stage:after{width:210px;height:112px;left:-28px;bottom:55px;opacity:.45}
    .hero-shot{position:relative;z-index:1;width:min(390px,88%);max-height:610px;object-fit:contain;border-radius:32px;box-shadow:var(--shadow)}
    section{padding:84px 0}
    .section-kicker{color:var(--accent-dark);font-size:13px;font-weight:800;letter-spacing:.08em}
    .section-title{max-width:780px;margin:8px 0 18px;font-size:clamp(30px,4vw,45px);line-height:1.25;letter-spacing:-.04em;text-wrap:balance}
    .section-lead{max-width:720px;margin:0 0 34px;color:var(--muted);font-size:16px}
    .features{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
    .feature{min-height:220px;padding:26px;border:1px solid var(--line);border-radius:24px;background:#fff}
    .feature-mark{width:46px;height:46px;display:grid;place-items:center;margin-bottom:22px;border-radius:15px;background:var(--accent-soft);color:var(--accent-dark);font-size:22px}
    .feature h3{margin:0 0 8px;font-size:20px;letter-spacing:-.03em}
    .feature p{margin:0;color:var(--muted);font-size:14px}
    .showcase-shell{border:1px solid var(--line);border-radius:34px;padding:28px;background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.82));box-shadow:0 18px 44px rgba(0,0,0,.05)}
    .showcase-top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}
    .showcase-copy p{margin:10px 0 0;color:var(--muted);font-size:15px}
    .carousel-controls{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .control-btn{width:48px;height:48px;border:none;border-radius:999px;background:#fff;color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.08);border:1px solid var(--line);transition:transform .18s ease, opacity .18s ease}
    .control-btn:hover{transform:translateY(-1px)}
    .control-btn:disabled{opacity:.35;cursor:default;transform:none}
    .carousel-counter{min-width:78px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}
    .carousel-viewport{overflow:hidden}
    .carousel-track{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,31%);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding-bottom:8px;scrollbar-width:none;-ms-overflow-style:none}
    .carousel-track::-webkit-scrollbar{display:none}
    .slide-card{scroll-snap-align:start;min-width:0}
    .slide-frame{padding:12px;border-radius:28px;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.06)}
    .slide-frame img{width:100%;height:auto;border-radius:20px}
    .slide-meta{padding:14px 6px 0}
    .slide-index{display:inline-flex;align-items:center;gap:6px;color:var(--accent-dark);font-size:12px;font-weight:800;letter-spacing:.08em}
    .slide-meta h3{margin:6px 0 6px;font-size:18px;letter-spacing:-.02em}
    .slide-meta p{margin:0;color:var(--muted);font-size:14px}
    .support{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .support a{display:block;padding:24px;border-radius:22px;background:#f7f3ed;text-decoration:none}
    .support small{display:block;color:var(--muted);font-size:12px}
    .support strong{display:block;margin-top:5px;font-size:19px}
    footer{padding:32px 0 48px;color:#8a817a;font-size:13px;text-align:center}
    @media (max-width: 900px){.carousel-track{grid-auto-columns:minmax(260px,45%)}}
    @media (max-width: 720px){.wrap{width:min(100% - 32px,560px)}.nav{align-items:flex-start}.nav-right{justify-content:flex-start}.hero{grid-template-columns:1fr;gap:30px;min-height:0;padding:32px 0 58px}.hero-stage{min-height:440px}.hero-shot{width:min(330px,88%)}.features,.support{grid-template-columns:1fr}.showcase-shell{padding:22px}.showcase-top{flex-direction:column;align-items:flex-start}.carousel-track{grid-auto-columns:minmax(255px,86%)}section{padding:64px 0}}
  </style>
</head>

        </div>
        <div class="carousel-viewport">
          <div class="carousel-track" data-track id="screen-track"></div>
        </div>
      </div>
    </section>

    <section class="wrap">
      <div class="section-kicker">SUPPORT</div>

      <div class="support">

          <small data-i18n="support_contact_small"></small>
          <strong data-i18n="support_contact_title"></strong>
        </a>
      </div>
    </section>
  </main>

    const langLinks = [...document.querySelectorAll('[data-lang]')];
    let currentLang = 'ja';

    function renderText(lang){
      const t = content[lang];
      document.documentElement.lang = lang === 'zh-TW' ? 'zh-Hant' : lang;
      document.getElementById('meta-description').setAttribute('content', t.meta_description);
      document.getElementById('og-title').setAttribute('content', `Sofubi Journal - ${lang}`);
      document.getElementById('og-description').setAttribute('content', t.meta_description);
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (t[key] != null) el.innerHTML = t[key];
      });
      badgesEl.innerHTML = t.badges.map(b => `<span>${b}</span>`).join('');
      featureList.innerHTML = t.features.map(f => `<article class="feature"><div class="feature-mark">${f.icon}</div><h3>${f.title}</h3><p>${f.desc}</p></article>`).join('');
      heroShot.src = t.screens[0].src;
      heroShot.alt = t.screens[0].alt;
      track.innerHTML = t.screens.map((s, i) => `
        <article class="slide-card" role="group" aria-label="${i+1} / ${t.screens.length}">
          <div class="slide-frame"><img src="${s.src}" alt="${s.alt}" loading="lazy"></div>
          <div class="slide-meta">
            <span class="slide-index">${String(i+1).padStart(2, '0')}</span>
            <h3>${s.title}</h3>
            <p>${s.desc}</p>
          </div>
        </article>`).join('');
      totalEl.textContent = t.screens.length;
      setupCarousel(document.querySelector('[data-carousel]'), true);
    }

    function setupCarousel(root, reset=false){
      const track = root.querySelector('[data-track]');
      const prev = root.querySelector('[data-prev]');
      const next = root.querySelector('[data-next]');
      const current = root.querySelector('[data-current]');
      const cards = [...track.children];
      const total = cards.length;
      if (reset) track.scrollLeft = 0;
      const update = () => {
        const offsets = cards.map(card => Math.abs(card.offsetLeft - track.scrollLeft));
        const index = offsets.indexOf(Math.min(...offsets));
        current.textContent = index + 1;
        prev.disabled = index <= 0;
        next.disabled = index >= total - 1;
      };
      const scrollToIndex = (index) => {
        const target = cards[Math.max(0, Math.min(total - 1, index))];
        if (!target) return;
        track.scrollTo({ left: target.offsetLeft, behavior: 'smooth' });
      };
      prev.onclick = () => scrollToIndex(Number(current.textContent) - 2);
      next.onclick = () => scrollToIndex(Number(current.textContent));
      track.onscroll = () => window.requestAnimationFrame(update);
      window.onresize = update;
      update();
    }

    langLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        currentLang = link.dataset.lang;
        normalizeAria();
        renderText(currentLang);
      });
    });
    function normalizeAria(){
      langLinks.forEach(item => item.removeAttribute('aria-current'));
      const current = langLinks.find(item => item.dataset.lang === currentLang);
      if (current) current.setAttribute('aria-current', 'true');
    }
    normalizeAria();
    renderText(currentLang);
  </script>
</body>
</html>
