<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8EFE7">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <meta id="meta-description" name="description" content="">
  <meta id="og-title" property="og:title" content="">
  <meta id="og-description" property="og:description" content="">
  <title>Sofubi Journal - Tsubasa Studio</title>

  <style>
    :root {
      --ink:#26211e;
      --muted:#746c66;
      --paper:#fffaf6;
      --line:#eaded5;
      --accent:#e76943;
      --accent-dark:#bd4e2d;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",
        "Hiragino Sans","Yu Gothic",Arial,sans-serif;
      line-height:1.65;
    }
    a { color:inherit; }
    .wrap { width:min(1120px,calc(100% - 40px)); margin:0 auto; }

    header { padding:22px 0; }
    .nav {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      font-size:14px;
    }
    .brand {
      font-weight:800;
      letter-spacing:.04em;
      text-decoration:none;
      white-space:nowrap;
    }
    .nav-right {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:18px;
      flex-wrap:wrap;
    }
    .nav-links {
      display:flex;
      gap:18px;
      flex-wrap:wrap;
    }
    .nav-links a {
      color:var(--muted);
      text-decoration:none;
    }

    .language-switcher {
      display:flex;
      gap:7px;
    }
    .language-switcher a {
      border:1px solid var(--line);
      border-radius:999px;
      color:#665d57;
      background:#fff;
      font-size:12px;
      font-weight:700;
      line-height:1;
      padding:9px 12px;
      text-decoration:none;
      transition:.15s ease;
    }
    .language-switcher a:hover {
      border-color:#cbbdb3;
      text-decoration:none;
    }
    .language-switcher a[aria-current="true"] {
      background:var(--ink);
      border-color:var(--ink);
      color:#fff;
    }

    .hero {
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:64px;
      align-items:center;
      min-height:650px;
      padding:48px 0 72px;
    }
    .eyebrow {
      display:inline-flex;
      padding:7px 13px;
      border-radius:999px;
      color:var(--accent-dark);
      background:#fff1eb;
      font-size:13px;
      font-weight:800;
    }
    h1 {
      margin:20px 0 18px;
      font-size:clamp(42px,6vw,72px);
      line-height:1.12;
      letter-spacing:-.055em;
    }
    .lead {
      max-width:590px;
      color:var(--muted);
      font-size:18px;
    }
    .badges {
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin-top:28px;
    }
    .badges span {
      border:1px solid var(--line);
      border-radius:999px;
      padding:7px 12px;
      color:#665d57;
      background:#fff;
      font-size:13px;
    }
    .actions {
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:30px;
    }
    .button {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      padding:0 19px;
      border-radius:14px;
      text-decoration:none;
      font-size:14px;
      font-weight:800;
    }
    .button:hover { text-decoration:none; }
    .button-primary {
      color:#fff;
      background:var(--ink);
      box-shadow:0 10px 24px rgba(38,33,30,.16);
    }
    .button-secondary {
      border:1px solid var(--line);
      background:#fff;
    }
    .availability {
      margin-top:14px;
      color:var(--muted);
      font-size:13px;
    }

    .phone-stage {
      min-height:560px;
      display:grid;
      place-items:center;
      border-radius:42px;
      background:
        radial-gradient(circle at 80% 12%,#ffd0bd 0,transparent 31%),
        linear-gradient(145deg,#edc8ad,#fbf6ef 57%,#e2efe8);
      overflow:hidden;
    }
    .phone {
      position:relative;
      width:min(295px,76vw);
      height:570px;
      overflow:hidden;
      border:9px solid #27221f;
      border-radius:42px;
      background:#fffdfb;
      box-shadow:0 30px 45px rgba(50,30,17,.28);
    }
    .island {
      position:absolute;
      z-index:3;
      left:50%;
      top:11px;
      width:104px;
      height:28px;
      border-radius:18px;
      background:#171311;
      transform:translateX(-50%);
    }
    .phone-hero {
      height:251px;
      padding:96px 20px 20px;
      color:#fff;
      background:
        linear-gradient(145deg,rgba(46,30,20,.05),rgba(32,18,12,.68)),
        linear-gradient(135deg,#bc7256,#6f4935 55%,#d99970);
    }
    .tiny { font-size:12px; opacity:.9; }
    .phone-hero h2 {
      margin:5px 0 0;
      font-size:29px;
      letter-spacing:-.04em;
    }
    .sheet {
      position:absolute;
      top:226px;
      width:100%;
      min-height:390px;
      padding:28px 18px;
      border-radius:28px 28px 0 0;
      background:#fffdfb;
    }
    .sheet-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:16px;
      font-weight:800;
    }
    .sheet-head span {
      color:#958b84;
      font-size:12px;
      font-weight:500;
    }
    .mini-row {
      display:flex;
      gap:10px;
      margin:18px 0 27px;
    }
    .mini-card {
      width:76px;
      font-size:10px;
      font-weight:700;
    }
    .mini-photo {
      height:92px;
      margin-bottom:6px;
      border-radius:12px;
      background:linear-gradient(145deg,#4e4037,#d97b51 48%,#e4c6a9);
    }
    .mini-card:nth-child(2) .mini-photo {
      background:linear-gradient(145deg,#edc4b3,#f1f0e1 44%,#9e755d);
    }
    .mini-card:nth-child(3) .mini-photo {
      background:linear-gradient(145deg,#395a48,#b6c68e 54%,#e9b681);
    }
    .diary {
      display:flex;
      align-items:center;
      gap:10px;
      padding-top:8px;
      border-top:1px solid #eee5df;
      font-size:12px;
    }
    .diary-photo {
      width:43px;
      height:43px;
      border-radius:9px;
      background:linear-gradient(145deg,#7b5d46,#d88962);
    }
    .tabbar {
      position:absolute;
      right:0;
      bottom:0;
      left:0;
      display:flex;
      justify-content:space-around;
      padding:11px 7px 13px;
      border-top:1px solid #eee5df;
      color:#82776f;
      background:#fffdfb;
      font-size:9px;
    }
    .tabbar b { color:var(--accent); }

    section { padding:86px 0; }
    .section-kicker {
      color:var(--accent);
      font-size:13px;
      font-weight:800;
      letter-spacing:.08em;
    }
    .section-title {
      max-width:720px;
      margin:8px 0 38px;
      font-size:clamp(30px,4vw,45px);
      line-height:1.25;
      letter-spacing:-.04em;
    }
    .features {
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:15px;
    }
    .feature {
      min-height:220px;
      padding:27px;
      border:1px solid var(--line);
      border-radius:24px;
      background:#fff;
    }
    .feature-mark {
      width:45px;
      height:45px;
      display:grid;
      place-items:center;
      margin-bottom:23px;
      border-radius:14px;
      color:var(--accent);
      background:#fff0e9;
      font-size:22px;
    }
    .feature h3 {
      margin:0 0 8px;
      font-size:20px;
      letter-spacing:-.03em;
    }
    .feature p {
      margin:0;
      color:var(--muted);
      font-size:14px;
    }


    .hero-screenshot {
      display:block;
      width:min(390px,88%);
      max-height:610px;
      object-fit:contain;
      border-radius:34px;
      box-shadow:0 30px 50px rgba(50,30,17,.22);
    }
    .phone-stage .phone { display:none; }

    .screens-showcase {
      display:grid;
      grid-template-columns:repeat(12,1fr);
      gap:18px;
      align-items:start;
    }
    .screen-card {
      margin:0;
      padding:18px;
      border:1px solid var(--line);
      border-radius:26px;
      background:#fff;
      overflow:hidden;
    }
    .screen-card img {
      display:block;
      width:100%;
      height:auto;
      border-radius:18px;
      background:#f8f5f1;
    }
    .screen-card figcaption {
      padding:14px 4px 2px;
    }
    .screen-card strong {
      display:block;
      font-size:17px;
      letter-spacing:-.02em;
    }
    .screen-card span {
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:13px;
    }
    .screen-card.featured {
      grid-column:span 7;
    }
    .screen-card.standard {
      grid-column:span 5;
    }
    .screen-card.half {
      grid-column:span 6;
    }

    .press-download {
      margin-top:24px;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .icon-preview {
      width:88px;
      height:88px;
      margin-top:20px;
      border-radius:20px;
      box-shadow:0 12px 28px rgba(0,0,0,.16);
    }

    .media-panel {
      padding:42px;
      border-radius:30px;
      color:#fffaf5;
      background:linear-gradient(130deg,#3e3028,#735240 60%,#b16b50);
    }
    .media-panel .section-kicker { color:#ffcab6; }
    .media-panel h2 {
      margin:8px 0 12px;
      font-size:clamp(28px,4vw,42px);
      letter-spacing:-.04em;
    }
    .media-panel p {
      max-width:720px;
      margin:0;
      color:#f4ddd1;
    }
    .asset-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:28px;
    }
    .asset {
      min-height:150px;
      padding:22px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:20px;
      background:rgba(255,255,255,.08);
    }
    .asset strong {
      display:block;
      margin-bottom:7px;
    }
    .asset span {
      color:#f4ddd1;
      font-size:13px;
    }
    .media-actions {
      margin-top:24px;
      display:flex;
      flex-wrap:wrap;
      gap:12px;
    }
    .media-actions .button-secondary {
      border-color:rgba(255,255,255,.28);
      color:#fff;
      background:rgba(255,255,255,.08);
    }
    .press-note {
      margin-top:30px;
      padding:24px;
      border:1px solid var(--line);
      border-radius:20px;
      background:#fff;
      color:var(--muted);
      font-size:14px;
    }
    .press-note strong { color:var(--ink); }

    .support {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .support a {
      display:block;
      padding:26px;
      border-radius:21px;
      background:#f6efe9;
      text-decoration:none;
    }
    .support small {
      display:block;
      color:var(--muted);
      font-size:12px;
    }
    .support strong {
      display:block;
      margin-top:5px;
      font-size:19px;
    }

    footer {
      padding:32px 0 48px;
      color:#8a817a;
      font-size:13px;
      text-align:center;
    }

    @media (max-width:820px) {
      .nav {
        align-items:flex-start;
      }
      .nav-right {
        gap:12px;
      }
    }
    @media (max-width:720px) {
      .wrap {
        width:min(100% - 32px,560px);
      }
      .nav {
        display:block;
      }
      .brand {
        display:inline-block;
        margin-bottom:16px;
      }
      .nav-right {
        justify-content:space-between;
        align-items:center;
      }
      .nav-links {
        gap:10px 14px;
      }
      .hero {
        grid-template-columns:1fr;
        gap:30px;
        min-height:0;
        padding:32px 0 58px;
      }
      .hero-copy { order:1; }
      .phone-stage {
        min-height:455px;
        order:2;
      }
      .phone {
        transform:scale(.8);
        margin:-57px 0;
      }
      .features,
      .support,
      .asset-grid {
        grid-template-columns:1fr;
      }
      .screen-card.featured,
      .screen-card.standard,
      .screen-card.half {
        grid-column:1 / -1;
      }
      .hero-screenshot {
        width:min(330px,88%);
      }
  
    .hero-screenshot {
      display:block;
      width:min(390px,88%);
      max-height:610px;
      object-fit:contain;
      border-radius:34px;
      box-shadow:0 30px 50px rgba(50,30,17,.22);
    }
    .phone-stage .phone { display:none; }

    .screens-showcase {
      display:grid;
      grid-template-columns:repeat(12,1fr);
      gap:18px;
      align-items:start;
    }
    .screen-card {
      margin:0;
      padding:18px;
      border:1px solid var(--line);
      border-radius:26px;
      background:#fff;
      overflow:hidden;
    }
    .screen-card img {
      display:block;
      width:100%;
      height:auto;
      border-radius:18px;
      background:#f8f5f1;
    }
    .screen-card figcaption {
      padding:14px 4px 2px;
    }
    .screen-card strong {
      display:block;
      font-size:17px;
      letter-spacing:-.02em;
    }
    .screen-card span {
      display:block;
      margin-top:4px;
      color:var(--muted);
      font-size:13px;
    }
    .screen-card.featured {
      grid-column:span 7;
    }
    .screen-card.standard {
      grid-column:span 5;
    }
    .screen-card.half {
      grid-column:span 6;
    }

    .press-download {
      margin-top:24px;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .icon-preview {
      width:88px;
      height:88px;
      margin-top:20px;
      border-radius:20px;
      box-shadow:0 12px 28px rgba(0,0,0,.16);
    }

    .media-panel { padding:30px; }
      section { padding:62px 0; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <nav class="nav">
      <a class="brand" href="#">TSUBASA STUDIO</a>

      <div class="nav-right">
        <div class="nav-links">
          <a id="nav-features" href="#features"></a>
          <a id="nav-press" href="#press"></a>
          <a id="nav-appstore" href="https://apps.apple.com/us/app/sofubi-journal/id6795497288" target="_blank" rel="noopener"></a>
        </div>

        <div class="language-switcher" aria-label="Language">
          <a href="?lang=ja" data-language="ja">日本語</a>
          <a href="?lang=en" data-language="en">English</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="wrap hero">
      <div class="hero-copy">
        <span class="eyebrow" id="hero-eyebrow"></span>
        <h1 id="hero-title"></h1>
        <p class="lead" id="hero-lead"></p>

        <div class="badges" id="hero-badges"></div>

        <div class="actions">
          <a class="button button-primary" id="hero-appstore" href="https://apps.apple.com/us/app/sofubi-journal/id6795497288" target="_blank" rel="noopener"></a>
          <a class="button button-secondary" id="hero-press" href="#press"></a>
        </div>

        <p class="availability" id="hero-availability"></p>
      </div>

      <div class="phone-stage" id="phone-stage">
        <img class="hero-screenshot" src="assets/screenshots/01-home.png" alt="Sofubi Journal home screen">
        <div class="phone">
          <div class="island"></div>
          <div class="phone-hero">
            <div class="tiny" id="phone-today"></div>
            <h2 id="phone-main-name"></h2>
          </div>
          <div class="sheet">
            <div class="sheet-head">
              <span id="phone-recent-heading" style="color:inherit;font-size:inherit;font-weight:inherit"></span>
              <span id="phone-see-all-1"></span>
            </div>
            <div class="mini-row">
              <div class="mini-card"><div class="mini-photo"></div><span id="phone-item-1"></span></div>
              <div class="mini-card"><div class="mini-photo"></div><span id="phone-item-2"></span></div>
              <div class="mini-card"><div class="mini-photo"></div><span id="phone-item-3"></span></div>
            </div>
            <div class="sheet-head">
              <span id="phone-journal-heading" style="color:inherit;font-size:inherit;font-weight:inherit"></span>
              <span id="phone-see-all-2"></span>
            </div>
            <div class="diary">
              <div class="diary-photo"></div>
              <div>
                <b id="phone-journal-entry"></b><br>
                <span class="tiny" id="phone-date" style="color:#847a73"></span>
              </div>
            </div>
          </div>
          <div class="tabbar">
            <b id="tab-home"></b>
            <span id="tab-collection"></span>
            <span id="tab-journal"></span>
            <span id="tab-settings"></span>
          </div>
        </div>
      </div>
    </section>

    <section class="wrap" id="features">
      <div class="section-kicker" id="features-kicker"></div>
      <h2 class="section-title" id="features-title"></h2>
      <div class="features" id="features-grid"></div>
    </section>


    <section class="wrap" id="screens">
      <div class="section-kicker" id="screens-kicker"></div>
      <h2 class="section-title" id="screens-title"></h2>

      <div class="screens-showcase">
        <figure class="screen-card featured">
          <img src="assets/screenshots/07-shelf.png" alt="Sofubi Journal digital shelf screen" loading="lazy">
          <figcaption><strong id="screen-shelf-title"></strong><span id="screen-shelf-body"></span></figcaption>
        </figure>

        <figure class="screen-card standard">
          <img src="assets/screenshots/02-collection.png" alt="Sofubi Journal collection screen" loading="lazy">
          <figcaption><strong id="screen-collection-title"></strong><span id="screen-collection-body"></span></figcaption>
        </figure>

        <figure class="screen-card half">
          <img src="assets/screenshots/04-detail.png" alt="Sofubi Journal detail screen" loading="lazy">
          <figcaption><strong id="screen-detail-title"></strong><span id="screen-detail-body"></span></figcaption>
        </figure>

        <figure class="screen-card half">
          <img src="assets/screenshots/05-diary.png" alt="Sofubi Journal diary screen" loading="lazy">
          <figcaption><strong id="screen-diary-title"></strong><span id="screen-diary-body"></span></figcaption>
        </figure>

        <figure class="screen-card half">
          <img src="assets/screenshots/03-add.png" alt="Sofubi Journal add sofubi screen" loading="lazy">
          <figcaption><strong id="screen-add-title"></strong><span id="screen-add-body"></span></figcaption>
        </figure>

        <figure class="screen-card half">
          <img src="assets/screenshots/06-summary.png" alt="Sofubi Journal summary screen" loading="lazy">
          <figcaption><strong id="screen-summary-title"></strong><span id="screen-summary-body"></span></figcaption>
        </figure>
      </div>
    </section>

    <section class="wrap" id="press">
      <div class="media-panel">
        <div class="section-kicker" id="press-kicker"></div>
        <h2 id="press-title"></h2>
        <p id="press-body"></p>

        <div class="asset-grid" id="asset-grid"></div>

        <img class="icon-preview" src="assets/icon.png" alt="Sofubi Journal app icon" loading="lazy">

        <div class="media-actions">
          <a class="button button-primary press-download" id="press-download" href="assets/press/Sofubi-Journal-Press-Kit.zip" download></a>
          <a class="button button-secondary" id="press-appstore" href="https://apps.apple.com/us/app/sofubi-journal/id6795497288" target="_blank" rel="noopener"></a>
          <a class="button button-secondary" id="media-inquiry"
             href="mailto:tsubasa.studio@icloud.com?subject=Sofubi%20Journal%20Press%20Inquiry"></a>
        </div>
      </div>

      <div class="press-note" id="press-note"></div>
    </section>

    <section class="wrap">
      <div class="section-kicker" id="about-kicker"></div>
      <h2 class="section-title" id="about-title"></h2>
      <p class="lead" id="about-body"></p>
    </section>

    <section class="wrap">
      <div class="section-kicker" id="contact-kicker"></div>
      <h2 class="section-title" id="contact-title"></h2>

      <div class="support">
        <a href="https://apps.apple.com/us/app/sofubi-journal/id6795497288" target="_blank" rel="noopener">
          <small id="contact-appstore-small"></small>
          <strong id="contact-appstore-strong"></strong>
        </a>
        <a href="mailto:tsubasa.studio@icloud.com?subject=Sofubi%20Journal">
          <small id="contact-email-small"></small>
          <strong id="contact-email-strong"></strong>
        </a>
      </div>
    </section>
  </main>

  <footer class="wrap">© Tsubasa Studio · Sofubi Journal</footer>

  <script>
    (() => {
      const supportedLanguages = ['ja', 'en'];
      const params = new URLSearchParams(window.location.search);
      const requestedLanguage = params.get('lang');
      const language = supportedLanguages.includes(requestedLanguage)
        ? requestedLanguage
        : 'ja';

      const content = {
        ja: {
          pageTitle: 'ソフビ手帳 - Tsubasa Studio',
          description: 'ソフビ手帳は、ソフビの写真・記録・コレクションを整理して楽しめる日本発のiPhoneアプリです。',
          ogTitle: 'ソフビ手帳 — ソフビコレクションを写真で残すiPhoneアプリ',
