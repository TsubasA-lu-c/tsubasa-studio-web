let lang='ja';const $=s=>document.querySelector(s);const badgeLocales={ja:'ja-jp',en:'en-us','zh-TW':'zh-tw'};const appStoreRegions={ja:'jp',en:'us','zh-TW':'tw'};const badgeAlt={ja:'App Storeからダウンロード',en:'Download on the App Store','zh-TW':'在 App Store 下載'};const render=()=>{const d=data[lang];document.documentElement.lang=lang==='zh-TW'?'zh-Hant':lang;$('#meta').content=d.lead;$('#kicker').textContent=d.kicker;$('#heroTitle').textContent=d.hero;$('#lead').textContent=d.lead;$('#screenBtn').textContent=d.screenBtn;$('#pressBtn').textContent=d.pressBtn;$('#appStoreLink').href=`https://apps.apple.com/${appStoreRegions[lang]}/app/id6795497288`;$('#appStoreBadge').src=`https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/${badgeLocales[lang]}?size=250x83`;$('#appStoreBadge').alt=badgeAlt[lang];$('#featureTitle').textContent=d.featureTitle;$('#featureLead').textContent=d.featureLead;$('#screenTitle').textContent=d.screenTitle;$('#screenLead').textContent=d.screenLead;$('#supportTitle').textContent=d.supportTitle;$('#supportLead').textContent=d.supportLead;$('#privacyLink').innerHTML=d.privacy;$('#contactLink').innerHTML=d.contact;$('#heroImg').src=`assets/screenshots/${lang}/01-home.png`;$('#features').innerHTML=d.features.map((f,i)=>`<article class="feature reveal"><small>${String(i+1).padStart(2,'0')}</small><h3>${f[0]}</h3><p>${f[1]}</p></article>`).join('');$('#track').innerHTML=d.screens.map((s,i)=>`<article class="slide"><div class="frame"><img src="assets/screenshots/${lang}/${s[0]}" alt="${s[1]}"></div><div class="slide-copy"><span>${String(i+1).padStart(2,'0')}</span><h3>${s[1]}</h3><p>${s[2]}</p></div></article>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));setupCarousel();observe();};
const observe=()=>{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.14});document.querySelectorAll('.reveal').forEach(e=>io.observe(e));};const setupCarousel=()=>{const root=document.querySelector('[data-carousel]'),track=root.querySelector('[data-track]'),prev=root.querySelector('[data-prev]'),next=root.querySelector('[data-next]'),cur=root.querySelector('[data-current]'),slides=[...track.children];const idx=()=>{let b=0,d=1e9;slides.forEach((s,i)=>{const x=Math.abs(s.offsetLeft-track.scrollLeft);if(x<d){d=x;b=i}});return b};const up=()=>{const i=idx();cur.textContent=String(i+1).padStart(2,'0');prev.disabled=i===0;next.disabled=i===slides.length-1};const go=n=>{const s=slides[Math.max(0,Math.min(slides.length-1,idx()+n))];track.scrollTo({left:s.offsetLeft,behavior:'smooth'})};prev.onclick=()=>go(-1);next.onclick=()=>go(1);track.onscroll=()=>requestAnimationFrame(up);up();};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});const bar=$('#bar');addEventListener('scroll',()=>{bar.style.width=(scrollY/(document.documentElement.scrollHeight-innerHeight)*100)+'%'},{passive:true});const device=document.querySelector('[data-device]');device.addEventListener('pointermove',e=>{const r=device.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;device.style.transform=`rotateX(${y*-5}deg) rotateY(${x*7}deg)`});device.addEventListener('pointerleave',()=>device.style.transform='');render();
