  <meta id="meta-description" name="description" content="">
  <meta id="og-title" property="og:title" content="">

    :root {
      --ink:#26211e; --muted:#746c66; --paper:#fffaf6; --line:#eaded5;
      --accent:#e76943; --accent-dark:#bd4e2d;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; background:var(--paper); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",
        "Hiragino Sans","PingFang TC","Noto Sans TC","Yu Gothic",Arial,sans-serif;
      line-height:1.65;
    }
    a { color:inherit; }
    .wrap { width:min(1120px,calc(100% - 40px)); margin:0 auto; }
    header { padding:22px 0; }
    .nav {
      display:flex; justify-content:space-between; align-items:center; gap:20px; font-size:14px;
    }
    .brand { font-weight:800; letter-spacing:.04em; text-decoration:none; white-space:nowrap; }
    .nav-right { display:flex; align-items:center; justify-content:flex-end; gap:18px; flex-wrap:wrap; }
    .nav-links { display:flex; gap:18px; flex-wrap:wrap; }
    .nav-links a { color:var(--muted); text-decoration:none; }
    .language-switcher { display:flex; flex-wrap:wrap; gap:7px; }
    .language-switcher a {
      border:1px solid var(--line); border-radius:999px; color:#665d57; background:#fff;
      font-size:12px; font-weight:700; line-height:1; padding:9px 12px; text-decoration:none;
    }
    .language-switcher a[aria-current="true"] {
      background:var(--ink); border-color:var(--ink); color:#fff;
    }
    .hero {
      display:grid; grid-template-columns:1.05fr .95fr; gap:64px; align-items:center;
      min-height:650px; padding:48px 0 72px;
    }
    .eyebrow {
      display:inline-flex; padding:7px 13px; border-radius:999px;
      color:var(--accent-dark); background:#fff1eb; font-size:13px; font-weight:800;
    }
    h1 {
      margin:20px 0 18px; font-size:clamp(42px,6vw,72px);
      line-height:1.12; letter-spacing:-.055em;
    }
    .lead { max-width:590px; color:var(--muted); font-size:18px; }
    .badges { display:flex; flex-wrap:wrap; gap:9px; margin-top:28px; }
    .badges span {
      border:1px solid var(--line); border-radius:999px; padding:7px 12px;
      color:#665d57; background:#fff; font-size:13px;
    }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:30px; }
    .button {
      display:inline-flex; align-items:center; justify-content:center; min-height:48px;
      padding:0 19px; border-radius:14px; text-decoration:none; font-size:14px; font-weight:800;
    }
    .button-primary { color:#fff; background:var(--ink); box-shadow:0 10px 24px rgba(38,33,30,.16); }
    .button-secondary { border:1px solid var(--line); background:#fff; }
    .availability { margin-top:14px; color:var(--muted); font-size:13px; }

    .phone-stage {
      min-height:560px; display:grid; place-items:center; border-radius:42px;
      background:radial-gradient(circle at 80% 12%,#ffd0bd 0,transparent 31%),
                 linear-gradient(145deg,#edc8ad,#fbf6ef 57%,#e2efe8);
      overflow:hidden; padding:28px;
    }
    .hero-screenshot {
      display:block; width:min(390px,88%); max-height:610px; object-fit:contain;
      border-radius:34px; box-shadow:0 30px 50px rgba(50,30,17,.22);
    }

    section { padding:86px 0; }
    .section-kicker {
      color:var(--accent); font-size:13px; font-weight:800; letter-spacing:.08em;
    }
    .section-title {
      max-width:760px; margin:8px 0 38px; font-size:clamp(30px,4vw,45px);
      line-height:1.25; letter-spacing:-.04em;
    }
    .features { display:grid; grid-template-columns:repeat(2,1fr); gap:15px; }
    .feature {
      min-height:220px; padding:27px; border:1px solid var(--line);
      border-radius:24px; background:#fff;
    }
    .feature-mark {
      width:45px; height:45px; display:grid; place-items:center; margin-bottom:23px;
      border-radius:14px; color:var(--accent); background:#fff0e9; font-size:22px;
    }
    .feature h3 { margin:0 0 8px; font-size:20px; letter-spacing:-.03em; }
    .feature p { margin:0; color:var(--muted); font-size:14px; }

    .screens-showcase {
      display:grid; grid-template-columns:repeat(12,1fr); gap:18px; align-items:start;
    }
    .screen-card {
      margin:0; padding:18px; border:1px solid var(--line); border-radius:26px;
      background:#fff; overflow:hidden;
    }
    .screen-card img {
      display:block; width:100%; height:auto; border-radius:18px; background:#f8f5f1;
    }
    .screen-card figcaption { padding:14px 4px 2px; }
    .screen-card strong { display:block; font-size:17px; letter-spacing:-.02em; }
    .screen-card span { display:block; margin-top:4px; color:var(--muted); font-size:13px; }
    .screen-card.featured { grid-column:span 7; }
    .screen-card.standard { grid-column:span 5; }
    .screen-card.half { grid-column:span 6; }

    .media-panel {
      padding:42px; border-radius:30px; color:#fffaf5;
      background:linear-gradient(130deg,#3e3028,#735240 60%,#b16b50);
    }
    .media-panel .section-kicker { color:#ffcab6; }
    .media-panel h2 {
      margin:8px 0 12px; font-size:clamp(28px,4vw,42px); letter-spacing:-.04em;
    }
    .media-panel p { max-width:760px; margin:0; color:#f4ddd1; }
    .asset-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:28px; }
    .asset {
      min-height:150px; padding:22px; border:1px solid rgba(255,255,255,.16);
      border-radius:20px; background:rgba(255,255,255,.08);
    }
    .asset strong { display:block; margin-bottom:7px; }
    .asset span { color:#f4ddd1; font-size:13px; }
    .icon-preview {
      width:88px; height:88px; margin-top:20px; border-radius:20px;
      box-shadow:0 12px 28px rgba(0,0,0,.16);
    }
    .media-actions { margin-top:24px; display:flex; flex-wrap:wrap; gap:12px; }
    .media-actions .button-secondary {
      border-color:rgba(255,255,255,.28); color:#fff; background:rgba(255,255,255,.08);
    }
    .press-note {
      margin-top:30px; padding:24px; border:1px solid var(--line);
      border-radius:20px; background:#fff; color:var(--muted); font-size:14px;
    }
    .press-note strong { color:var(--ink); }

    .support { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .support a { display:block; padding:26px; border-radius:21px; background:#f6efe9; text-decoration:none; }
    .support small { display:block; color:var(--muted); font-size:12px; }
    .support strong { display:block; margin-top:5px; font-size:19px; }
    footer { padding:32px 0 48px; color:#8a817a; font-size:13px; text-align:center; }

    @media (max-width:820px) {
      .nav { align-items:flex-start; }
      .nav-right { gap:12px; }
    }
    @media (max-width:720px) {
      .wrap { width:min(100% - 32px,560px); }
      .nav { display:block; }
      .brand { display:inline-block; margin-bottom:16px; }
      .nav-right { justify-content:space-between; align-items:center; }
      .nav-links { gap:10px 14px; }
      .hero { grid-template-columns:1fr; gap:30px; min-height:0; padding:32px 0 58px; }
      .phone-stage { min-height:455px; }
      .hero-screenshot { width:min(330px,88%); }
      .features,.support,.asset-grid { grid-template-columns:1fr; }
      .screen-card.featured,.screen-card.standard,.screen-card.half { grid-column:1 / -1; }
      .media-panel { padding:30px; }
      section { padding:62px 0; }
    }
  </style>
</head>
