<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tsubasa Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #FFFFFF;
      color: #111111;
      line-height: 1.8;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .lead { font-size: 14px; color: #555555; margin-bottom: 40px; }
    .app-card {
      border: 1px solid #E0E0E0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
    }
    .app-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .links a {
      display: inline-block;
      font-size: 14px;
      color: #1E88E5;
      text-decoration: none;
      margin-right: 16px;
    }
    .links a:hover { text-decoration: underline; }
    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #888888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tsubasa Studio</h1>
    <p class="lead">開発しているアプリのサポート・プライバシーポリシーはこちらからご確認いただけます。</p>

    <div class="app-card">
      <h2>チケノート</h2>
      <div class="links">
        <a href="/chikenote/support">サポート</a>
      </div>
    </div>

    <div class="app-card">
      <h2>プライバシーポリシー</h2>
      <p style="font-size:14px; color:#555555; margin-bottom:12px;">提供する全アプリ共通のプライバシーポリシーです。</p>
      <div class="links">
        <a href="/privacy">プライバシーポリシーを見る</a>
      </div>
    </div>

    <p class="footer">Tsubasa Studio</p>
  </div>
</body>
</html>
