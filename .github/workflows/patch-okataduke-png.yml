name: Patch Okataduke PNG sources

on:
  push:
    branches:
      - fix/okataduke-png-source

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/okataduke-png-source
      - name: Patch screenshot references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('okataduke/index.html')
          text = page.read_text()
          names = ['01-today','02-timer','03-overtime','04-rooms','05-rank-up','06-history']
          for name in names:
              old = f'assets/screenshots/{name}.webp'
              new = f'assets/screenshots/{name}.png'
              if old not in text:
                  raise SystemExit(f'missing expected reference: {old}')
              text = text.replace(old, new)
          page.write_text(text)

          top = Path('index.html')
          text = top.read_text()
          old_markup = '<div class="device" data-tilt><div class="house-device"><span class="hd-kicker">LIVING ROOM</span><strong>リビング Lv.3</strong><div class="house-room"></div><div class="house-timer"><small>今日の片付け</small><b>15:00</b><div class="house-start">5分だけ始める</div></div></div></div>'
          new_markup = '<div class="device" data-tilt><img src="okataduke/assets/screenshots/01-today.png" alt="おかたづけハウス"></div>'
          if old_markup not in text:
              raise SystemExit('missing expected top-page mock markup')
          text = text.replace(old_markup, new_markup)

          obsolete_css = '''.house-device{width:100%;aspect-ratio:9/19.5;border-radius:32px;background:linear-gradient(#f8f0df,#f0dfc9);padding:44px 17px 17px;position:relative;overflow:hidden}\n.house-device:before{content:"";position:absolute;top:11px;left:50%;width:88px;height:24px;border-radius:18px;background:#211b18;transform:translateX(-50%)}\n.house-device .hd-kicker{font-size:9px;font-weight:900;letter-spacing:.1em;color:#9b735a}.house-device strong{display:block;margin-top:2px;font-size:23px;letter-spacing:-.05em}.house-room{height:43%;margin-top:15px;border-radius:16px;border:1px solid #d8bea0;background:linear-gradient(#ead4b7 63%,#be8d63 63%);position:relative;overflow:hidden}.house-room:before{content:"";position:absolute;left:15%;bottom:17%;width:48%;height:27%;background:#966342;box-shadow:72px -20px 0 -12px #75533c,90px 4px 0 -4px #c7a17a}.house-room:after{content:"CAT";position:absolute;right:10%;bottom:14%;padding:6px 7px;border-radius:8px;background:#2d2824;color:#fff;font-size:8px;font-weight:900}.house-timer{margin-top:14px;padding:13px;border-radius:15px;background:#fff9ef;border:1px solid #dec7ad}.house-timer small{display:block;color:#8d7768;font-size:9px}.house-timer b{display:block;font-size:24px;letter-spacing:-.04em}.house-start{margin-top:9px;padding:9px;border-radius:11px;background:#a95f34;color:#fff;text-align:center;font-size:10px;font-weight:900}\n'''
          if obsolete_css not in text:
              raise SystemExit('missing expected obsolete top-page CSS')
          text = text.replace(obsolete_css, '')
          top.write_text(text)
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/patch-okataduke-png.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use PNG screenshots for Okataduke pages"
          git push origin HEAD:fix/okataduke-png-source
