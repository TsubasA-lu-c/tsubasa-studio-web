name: Patch Okataduke homepage
on:
  push:
    branches: [feat/okataduke-intro-home]
    paths: ['.github/workflows/patch-okataduke-home.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/okataduke-intro-home
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'missing target: {old[:80]}')
              s = s.replace(old, new, 1)

          rep('.ol4{right:7%;bottom:2%;animation:floatB 7.5s ease-in-out infinite reverse}', '.ol4{right:7%;bottom:2%;animation:floatB 7.5s ease-in-out infinite reverse}\n.ol5{right:24%;top:2%;animation:floatA 8.5s ease-in-out infinite}')
          rep('.doudemo{--section-bg:#f3edf8;--section-accent:#876ed4;--section-fg:#4b3b35;--section-muted:#806f68}', '.doudemo{--section-bg:#f3edf8;--section-accent:#876ed4;--section-fg:#4b3b35;--section-muted:#806f68}\n.okataduke{--section-bg:#f7f2e8;--section-accent:#a95f34;--section-fg:#211b18;--section-muted:#766d65}\n.store-pending{display:inline-flex;align-items:center;padding:13px 16px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--section-fg) 22%,transparent);font-size:12px;font-weight:850;color:var(--section-muted);background:color-mix(in srgb,#fff 28%,transparent)}\n.house-device{width:100%;aspect-ratio:9/19.5;border-radius:32px;background:linear-gradient(#f8f0df,#f0dfc9);padding:44px 17px 17px;position:relative;overflow:hidden}\n.house-device:before{content:"";position:absolute;top:11px;left:50%;width:88px;height:24px;border-radius:18px;background:#211b18;transform:translateX(-50%)}\n.house-device .hd-kicker{font-size:9px;font-weight:900;letter-spacing:.1em;color:#9b735a}.house-device strong{display:block;margin-top:2px;font-size:23px;letter-spacing:-.05em}.house-room{height:43%;margin-top:15px;border-radius:16px;border:1px solid #d8bea0;background:linear-gradient(#ead4b7 63%,#be8d63 63%);position:relative;overflow:hidden}.house-room:before{content:"";position:absolute;left:15%;bottom:17%;width:48%;height:27%;background:#966342;box-shadow:72px -20px 0 -12px #75533c,90px 4px 0 -4px #c7a17a}.house-room:after{content:"CAT";position:absolute;right:10%;bottom:14%;padding:6px 7px;border-radius:8px;background:#2d2824;color:#fff;font-size:8px;font-weight:900}.house-timer{margin-top:14px;padding:13px;border-radius:15px;background:#fff9ef;border:1px solid #dec7ad}.house-timer small{display:block;color:#8d7768;font-size:9px}.house-timer b{display:block;font-size:24px;letter-spacing:-.04em}.house-start{margin-top:9px;padding:9px;border-radius:11px;background:#a95f34;color:#fff;text-align:center;font-size:10px;font-weight:900}')

          rep('<button aria-label="どうでもメモ" data-target="doudemo"><span class="p-num">04</span><span class="p-line"></span><span class="p-name">MEMO</span></button>', '<button aria-label="どうでもメモ" data-target="doudemo"><span class="p-num">04</span><span class="p-line"></span><span class="p-name">MEMO</span></button>\n  <button aria-label="おかたづけハウス" data-target="okataduke"><span class="p-num">05</span><span class="p-line"></span><span class="p-name">HOUSE</span></button>')
          rep('<div class="hero-meta"><span>04 APPS</span>', '<div class="hero-meta"><span>05 APPS</span>')
          rep('<div class="orbit-label ol4"><span>04</span>DOUDEMO MEMO</div>', '<div class="orbit-label ol4"><span>04</span>DOUDEMO MEMO</div>\n      <div class="orbit-label ol5"><span>05</span>OKATADUKE HOUSE</div>')
          for n in ('01','02','03','04'):
              rep(f'<div class="num">{n} / 04</div>', f'<div class="num">{n} / 05</div>')

          marker = '</section>\n</main>\n\n<section class="end" id="end">'
          section = '''</section>\n\n<section class="app-section okataduke" id="okataduke" data-bg="#f7f2e8" data-fg="#211b18">\n  <div class="wrap">\n    <div class="ghost-word" aria-hidden="true">HOUSE</div>\n    <div class="app-copy">\n      <div class="num">05 / 05</div>\n      <div class="category">片付けタイマー</div>\n      <h2>おかたづけ<br>ハウス</h2>\n      <p class="description">まず5分。片付けた時間で6つの部屋と相棒の暮らしが育つ。</p>\n      <div class="links"><span class="store-pending">App Store 公開準備中</span><a class="link-secondary" href="okataduke/">アプリ紹介 →</a><a class="link-secondary" href="okataduke/support.html">サポート</a></div>\n    </div>\n    <div class="device-stage">\n      <div class="aura"></div>\n      <div class="device" data-tilt><div class="house-device"><span class="hd-kicker">LIVING ROOM</span><strong>リビング Lv.3</strong><div class="house-room"></div><div class="house-timer"><small>今日の片付け</small><b>15:00</b><div class="house-start">5分だけ始める</div></div></div></div>\n      <div class="device-label">OKATADUKE HOUSE / 05</div>\n    </div>\n  </div>\n</section>\n</main>\n\n<section class="end" id="end">'''
          rep(marker, section)
          p.write_text(s)
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/patch-okataduke-home.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add おかたづけハウス to homepage"
          git push origin HEAD:feat/okataduke-intro-home
