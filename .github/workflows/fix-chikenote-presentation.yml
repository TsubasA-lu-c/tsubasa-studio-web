name: Fix Chikenote presentation

on:
  push:
    paths:
      - '.github/workflows/fix-chikenote-presentation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize frames and refresh top image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('chikenote/index.html')
          text = p.read_text()
          text = text.replace('class="shot-frame dark"', 'class="shot-frame"')
          p.write_text(text)
          PY
          cp chikenote/assets/screenshots/01-home.png assets/ticketnote.png
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chikenote/index.html assets/ticketnote.png
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix Chikenote screenshot presentation"
          git push
