name: Refresh Chikenote screenshots

on:
  push:
    paths:
      - '.github/workflows/refresh-chikenote-screenshots.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-23d4-8211-8474-e5d79db3a709/raw?se=2026-08-28T16%3A13%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=7f4901b7-2102-5758-a8bc-87197a2b5bbb&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A21%3A58Z&ske=2026-08-29T03%3A21%3A58Z&sks=b&skv=2026-02-06&sig=kvtSEVXPIXGdCZuEFbxUmAn0FTLXS9bc6lqDzQO7E7g%3D"
    steps:
      - uses: actions/checkout@v4

      - name: Download raw App Store screenshots
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/chikenote-screenshots.zip
          rm -rf /tmp/chikenote-screenshots
          mkdir -p /tmp/chikenote-screenshots
          unzip -q /tmp/chikenote-screenshots.zip -d /tmp/chikenote-screenshots

      - name: Replace website screenshots
        run: |
          mkdir -p chikenote/assets/screenshots
          cp /tmp/chikenote-screenshots/01_home.png chikenote/assets/screenshots/01-home.png
          cp /tmp/chikenote-screenshots/02_my_tickets.png chikenote/assets/screenshots/02-my-ticket.png
          cp /tmp/chikenote-screenshots/03_artist_detail.png chikenote/assets/screenshots/03-artist-detail.png
          cp /tmp/chikenote-screenshots/04_artists.png chikenote/assets/screenshots/04-artists.png
          cp /tmp/chikenote-screenshots/05_calendar.png chikenote/assets/screenshots/05-calendar.png
          cp /tmp/chikenote-screenshots/06_setlist.png chikenote/assets/screenshots/06-setlist.png
          rm -f chikenote/assets/screenshots/05-ticket-detail.png \
                chikenote/assets/screenshots/06-analysis-premium.png \
                chikenote/assets/screenshots/07-url-import.png

      - name: Update screenshot carousel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('chikenote/index.html')
          text = path.read_text()
          start = text.index('<section class="screens-section" id="screens">')
          end = text.index('<section class="extra-section" id="premium">')
          section = '''<section class="screens-section" id="screens"><div class="wrap"><div class="section-head reveal"><div><span class="kicker">SCREENS</span><h2>主な画面</h2></div><p>チケノートの主な画面です。</p></div><div class="carousel-shell reveal" data-carousel><div class="carousel-top"><div class="count"><span data-current>01</span> / 06</div><div class="carousel-buttons"><button type="button" data-prev aria-label="前の画面">←</button><button type="button" data-next aria-label="次の画面">→</button></div></div><div class="carousel" data-track><article class="slide" data-slide>
            <div class="shot-frame dark"><img src="assets/screenshots/01-home.png" alt="ホーム" loading="lazy"></div>
            <div class="slide-copy"><span>01</span><h3>ホーム</h3><p>今日やることとライブ予定をひと目で確認。</p></div>
          </article>
          <article class="slide" data-slide>
            <div class="shot-frame"><img src="assets/screenshots/02-my-ticket.png" alt="マイチケット" loading="lazy"></div>
            <div class="slide-copy"><span>02</span><h3>マイチケット</h3><p>申込・当落・入金状況までまとめて管理。</p></div>
          </article>
          <article class="slide" data-slide>
            <div class="shot-frame dark"><img src="assets/screenshots/03-artist-detail.png" alt="アーティスト詳細" loading="lazy"></div>
            <div class="slide-copy"><span>03</span><h3>アーティスト詳細</h3><p>ライブ情報や楽曲をひとつの画面で確認。</p></div>
          </article>
          <article class="slide" data-slide>
            <div class="shot-frame"><img src="assets/screenshots/04-artists.png" alt="アーティスト" loading="lazy"></div>
            <div class="slide-copy"><span>04</span><h3>アーティスト</h3><p>登録したアーティストを一覧で管理。</p></div>
          </article>
          <article class="slide" data-slide>
            <div class="shot-frame"><img src="assets/screenshots/05-calendar.png" alt="カレンダー" loading="lazy"></div>
            <div class="slide-copy"><span>05</span><h3>カレンダー</h3><p>申込締切や公演日を月単位で確認。</p></div>
          </article>
          <article class="slide" data-slide>
            <div class="shot-frame dark"><img src="assets/screenshots/06-setlist.png" alt="セットリスト" loading="lazy"></div>
            <div class="slide-copy"><span>06</span><h3>セットリスト</h3><p>登録したライブのセットリストを確認。</p></div>
          </article></div></div></div></section>
          '''
          path.write_text(text[:start] + section + text[end:])
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chikenote/index.html chikenote/assets/screenshots
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Chikenote website screenshots"
          git push
